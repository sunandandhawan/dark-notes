<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Notes</title>
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg: #000000;
            --surface: #121212;
            --border: #333333;
            --text: #e0e0e0;
            --text-muted: #9e9e9e;
            --accent: #ffffff;
            --danger: #cf6679;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 1px; }

        .btn-group { display: flex; gap: 10px; }

        button, .btn {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        button:hover, .btn:hover {
            background: var(--surface);
            border-color: var(--accent);
        }

        .editor {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
            background: var(--surface);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        input[type="text"], textarea {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px;
            border-radius: 6px;
            font-family: inherit;
            resize: vertical;
        }
        
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea { min-height: 100px; }

        #saveBtn {
            background: var(--text);
            color: var(--bg);
            font-weight: bold;
            border: none;
        }
        #saveBtn:hover { background: #ccc; }

        .notes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .note-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
        }

        .note-title {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
        }

        .note-body {
            margin: 0 0 16px 0;
            color: var(--text-muted);
            white-space: pre-wrap;
            flex-grow: 1;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .note-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            padding-top: 12px;
        }

        .delete-btn {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 4px 8px;
        }
        .delete-btn:hover { background: rgba(207, 102, 121, 0.1); border-color: var(--danger); }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Dark Notes</h1>
            <div class="btn-group">
                <button onclick="exportNotes()">Export JSON</button>
                <label class="btn" for="fileInput">Import JSON</label>
                <input type="file" id="fileInput" accept=".json">
            </div>
        </header>

        <main>
            <div class="editor">
                <input type="text" id="noteTitle" placeholder="Note Title...">
                <textarea id="noteBody" placeholder="Write your note here..."></textarea>
                <button id="saveBtn" onclick="addNote()">Save Note</button>
            </div>

            <div class="notes-grid" id="notesGrid"></div>
        </main>
    </div>

    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('ServiceWorker registered'))
                    .catch(err => console.error('ServiceWorker error: ', err));
            });
        }

        // App Logic
        let notes = JSON.parse(localStorage.getItem('dark_notes')) || [];

        const notesGrid = document.getElementById('notesGrid');
        const titleInput = document.getElementById('noteTitle');
        const bodyInput = document.getElementById('noteBody');
        const fileInput = document.getElementById('fileInput');

        function renderNotes() {
            notesGrid.innerHTML = '';
            // Sort by newest first
            const sortedNotes = notes.sort((a, b) => b.timestamp - a.timestamp);

            sortedNotes.forEach(note => {
                const date = new Date(note.timestamp).toLocaleDateString(undefined, { 
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                });

                const card = document.createElement('div');
                card.className = 'note-card';
                card.innerHTML = `
                    <h3 class="note-title">${escapeHTML(note.title) || 'Untitled'}</h3>
                    <div class="note-body">${escapeHTML(note.body)}</div>
                    <div class="note-footer">
                        <span>${date}</span>
                        <button class="delete-btn" onclick="deleteNote(${note.id})">Delete</button>
                    </div>
                `;
                notesGrid.appendChild(card);
            });
        }

        function addNote() {
            const title = titleInput.value.trim();
            const body = bodyInput.value.trim();

            if (!body && !title) return alert('Cannot save an empty note.');

            const newNote = {
                id: Date.now(),
                title: title,
                body: body,
                timestamp: Date.now()
            };

            notes.push(newNote);
            saveData();
            
            titleInput.value = '';
            bodyInput.value = '';
            renderNotes();
        }

        function deleteNote(id) {
            if(confirm('Delete this note?')) {
                notes = notes.filter(n => n.id !== id);
                saveData();
                renderNotes();
            }
        }

        function saveData() {
            localStorage.setItem('dark_notes', JSON.stringify(notes));
        }

        // Export/Import Features
        function exportNotes() {
            const dataStr = JSON.stringify(notes, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = `dark_notes_backup_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const imported = JSON.parse(event.target.result);
                    if (Array.isArray(imported)) {
                        notes = imported;
                        saveData();
                        renderNotes();
                        alert('Notes imported successfully!');
                    } else {
                        alert('Invalid JSON format.');
                    }
                } catch (err) {
                    alert('Error parsing JSON file.');
                }
                fileInput.value = ''; // Reset input
            };
            reader.readAsText(file);
        });

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag])
            );
        }

        // Initial Render
        renderNotes();
    </script>
</body>
</html>
